<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel → カレンダー</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#18202f;--mu:#6b7488;--ac:#2563eb;--ac2:#1d4ed8;--soft:#eaf0ff;--bd:#e3e7f0;--sh:0 1px 2px #1018280d,0 8px 24px #1018280f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e9ecf3;--mu:#97a0b4;--ac:#6190ff;--ac2:#7aa0ff;--soft:#1f2a47;--bd:#2a3040;--sh:0 1px 2px #0006,0 8px 24px #0004}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
main{max-width:1000px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;box-shadow:0 6px 16px #2563eb55}
h1{font-size:21px;margin:0;letter-spacing:.01em}.sub{margin:0;color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.steps span{font-size:12px;color:var(--mu);background:var(--card);border:1px solid var(--bd);padding:3px 10px;border-radius:99px}
.steps b{color:var(--ac);margin-right:4px}
#drop{display:block;border:2px dashed var(--bd);border-radius:14px;padding:30px 16px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg)}
#drop:hover,#drop.on{border-color:var(--ac);background:var(--soft)}
#drop svg{display:block;margin:0 auto 6px}
#drop strong{display:block}#drop small{color:var(--mu)}
#file{display:none}
#st{margin:12px 2px 0;color:var(--mu);font-size:14px;min-height:22px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:780px}
th{position:sticky;top:0;background:var(--bg);font-size:12px;font-weight:600;color:var(--mu);text-align:left;padding:9px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:5px 4px;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--soft)}
td input[type=text],td input[type=date],td input[type=time]{width:100%;padding:6px 8px;border:1px solid transparent;border-radius:8px;background:transparent;font:inherit;font-size:13px;color:inherit}
td input[type=text]:hover,td input[type=date]:hover,td input[type=time]:hover{border-color:var(--bd)}
td input:focus{outline:none;border-color:var(--ac);background:var(--card);box-shadow:0 0 0 3px var(--soft)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--ac);margin:0 8px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-top:16px}
.bar input[type=text]{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--bg);font:inherit;font-size:13px;color:inherit}
.bar input[type=text]:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--soft)}
button{font:inherit;padding:10px 20px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;transition:.15s}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;box-shadow:0 4px 14px #2563eb44}
button.p:hover{background:var(--ac2)}button:disabled{opacity:.5}
#dlg{position:fixed;inset:0;background:#0b0f1a99;backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px}
#dlg .box{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #0006}
#dlg .dh{padding:20px 22px 8px}
#dlg .dbody{overflow:auto;padding:0 22px;flex:1;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
#dlg .dbody::-webkit-scrollbar{width:8px}#dlg .dbody::-webkit-scrollbar-thumb{background:var(--bd);border-radius:99px}
#dlg .ft{padding:12px 22px 18px;border-top:1px solid var(--bd);background:var(--card)}
#dlg h1{font-size:18px;margin:0}
.ev{background:var(--bg);border-left:4px solid var(--ac);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
.mu{color:var(--mu);font-size:13px}
.act{display:flex;gap:10px;justify-content:flex-end}
#st.err{color:#dc2626}@media(prefers-color-scheme:dark){#st.err{color:#f87171}}
#st{display:flex;align-items:center;gap:10px}.sp{width:18px;height:18px;flex:none;border:3px solid var(--soft);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#drop.busy{opacity:.6;pointer-events:none}
#rs{margin:0 0 10px;min-height:0}#rs:empty{display:none}
</style>
</head>
<body>
<main>
<header>
<div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3"/></svg></div>
<div><h1>Excel → カレンダー</h1><p class="sub">ExcelをAIが読み取り、ICSファイルとして書き出します</p></div>
</header>
<div class="steps"><span><b>1</b>アップロード</span><span><b>2</b>内容を確認・編集</span><span><b>3</b>ICS書き出し</span></div>
<div class="card">
<label id="drop" for="file">
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--ac)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
<strong>Excelファイルを選択、またはドロップ</strong>
<small>.xlsx / .xls / .csv</small>
</label>
<input type="file" id="file" accept=".xlsx,.xls,.csv">
<p id="st"></p>
</div>
<div class="card" id="res" hidden>
<div class="tw"><table><thead><tr><th></th><th>タイトル</th><th>日付</th><th>開始</th><th>終了</th><th>終日</th><th>場所</th><th>メモ</th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="bar"><button class="p" id="ics">ICSファイルで書き出し…</button></div>
</div>
</main>
<div id="dlg"><div class="box">
<div class="dh"><h1 id="dt">この内容で書き出しますか?</h1></div>
<div class="dbody"><div id="list"></div><p class="mu">タイムゾーン: Asia/Tokyo</p></div>
<div class="ft"><p id="rs" class="mu"></p><div class="act"><button id="no">キャンセル</button><button class="p" id="ok">実行する</button></div></div>
</div></div>
<script>
var API="https://calendar.user-x45.workers.dev";
var $=function(i){return document.getElementById(i)},events=[],TZ="Asia/Tokyo";
function st(t,load,err){var el=$("st");el.classList.toggle("err",!!err);el.textContent="";if(load){var s=document.createElement("span");s.className="sp";el.appendChild(s)}el.appendChild(document.createTextNode(t));$("drop").classList.toggle("busy",!!load)}

$("file").onchange=async function(e){
  var f=e.target.files[0];if(!f)return;
  events=[];st("読み込み中…",true);
  try{
    var wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),rows=[];
    wb.SheetNames.forEach(function(n){
      var a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,dateNF:"yyyy-mm-dd hh:mm",defval:""});
      a=a.filter(function(r){return r.some(function(c){return String(c).trim()})});
      if(a.length){var h=a[0];for(var i=1;i<a.length;i++)rows.push({header:h,row:a[i]})}
    });
    var today=new Date().toISOString().slice(0,10),size=25;
    var chunks=[];for(var i=0;i<rows.length;i+=size)chunks.push(rows.slice(i,i+size));
    var done=0,par=3,errs=0,lastErr="";
    for(var i=0;i<chunks.length;i+=par){
      st("AI解析中… "+done+"/"+chunks.length,true);
      var res=await Promise.all(chunks.slice(i,i+par).map(function(ch){
        return fetch(API+"/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({today:today,rows:ch})})
          .then(function(r){return r.json()}).then(function(d){if(d.error){errs++;lastErr=d.error}done++;st("AI解析中… "+done+"/"+chunks.length,true);return d.events||[]});
      }));
      res.forEach(function(a){events=events.concat(a)});
    }
    events.forEach(function(x){x.on=true});
    render();
    if(events.length)st(events.length+"件の予定を検出しました。内容を確認・編集してください。"+(errs?"(解析に失敗した部分が"+errs+"箇所あります)":""));
    else if(!rows.length)st("エラー: ファイルにデータ行が見つかりませんでした。",false,true);
    else if(errs)st("エラー: AI解析に失敗しました ("+lastErr+")",false,true);
    else st("エラー: AIが予定を1件も抽出できませんでした。日付の列があるか、内容が正しいか確認してください。",false,true);
  }catch(err){st("エラー: "+err,false,true)}
};

function cell(i,k,type){
  var v=events[i][k];v=(v==null||v==="null")?"":v;
  return '<td><input type="'+(type||"text")+'" data-i="'+i+'" data-k="'+k+'" value="'+String(v).replace(/"/g,"&quot;")+'"></td>';
}
function render(){
  $("res").hidden=!events.length;
  $("tb").innerHTML=events.map(function(x,i){
    return "<tr><td><input type=checkbox data-i='"+i+"' data-k='on' "+(x.on?"checked":"")+"></td>"+
    cell(i,"title")+cell(i,"date","date")+cell(i,"start","time")+cell(i,"end","time")+
    "<td><input type=checkbox data-i='"+i+"' data-k='allDay' "+(x.allDay?"checked":"")+"></td>"+
    cell(i,"location")+cell(i,"description")+"</tr>";
  }).join("");
}
$("tb").oninput=function(e){
  var t=e.target,i=t.dataset.i,k=t.dataset.k;if(i==null)return;
  events[i][k]=t.type==="checkbox"?t.checked:t.value;
};
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function sel(){return events.filter(function(x){return x.on&&x.title&&x.date})}

var mode="api";
$("ics").onclick=function(){openDlg("ics")};
function openDlg(m){
  mode=m;var s=sel();if(!s.length){alert("追加する予定がありません");return}
  $("dt").textContent="この内容でICSファイルを書き出しますか?";
  $("ok").textContent="ダウンロード";
  $("list").innerHTML=s.map(function(x){
    var when=x.allDay?x.date+"(終日)":x.date+" "+(x.start||"00:00")+" – "+(x.end||"+1時間");
    return '<div class="ev"><b>'+esc(x.title)+'</b><br>'+esc(when)+(x.location?"<br>📍"+esc(x.location):"")+(x.description?'<br><span class="mu">'+esc(x.description)+"</span>":"")+"</div>";
  }).join("")+"<p><b>"+s.length+"件</b>を書き出します。</p>";
  $("rs").textContent="";$("dlg").style.display="flex";
}
$("no").onclick=function(){$("dlg").style.display="none"};

function plus1h(d,t){var x=new Date(d+"T"+t+":00");x.setHours(x.getHours()+1);var p=function(n){return String(n).padStart(2,"0")};return x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate())+"T"+p(x.getHours())+":"+p(x.getMinutes())+":00"}
function body(x){
  var b={summary:x.title,location:x.location||undefined,description:x.description||undefined};
  if(x.allDay||!x.start){
    var n=new Date(x.date+"T00:00:00");n.setDate(n.getDate()+1);
    var e=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
    b.start={date:x.date};b.end={date:e};
  }else{
    b.start={dateTime:x.date+"T"+x.start+":00",timeZone:TZ};
    b.end={dateTime:x.end?x.date+"T"+x.end+":00":plus1h(x.date,x.start),timeZone:TZ};
  }
  return b;
}
function ics(list){
  var p=function(n){return String(n).padStart(2,"0")},e=function(t){return String(t==null?"":t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n")};
  var d=function(x){return x.replace(/-/g,"")},stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//excel-to-gcal//JA","CALSCALE:GREGORIAN",
  "BEGIN:VTIMEZONE","TZID:Asia/Tokyo","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:+0900","TZOFFSETTO:+0900","TZNAME:JST","END:STANDARD","END:VTIMEZONE"];
  list.forEach(function(x){
    var b=body(x);L.push("BEGIN:VEVENT","UID:"+Math.random().toString(36).slice(2)+Date.now()+"@excel-to-gcal","DTSTAMP:"+stamp);
    if(b.start.date){L.push("DTSTART;VALUE=DATE:"+d(b.start.date),"DTEND;VALUE=DATE:"+d(b.end.date))}
    else{L.push("DTSTART;TZID="+TZ+":"+d(b.start.dateTime).replace(/:/g,""),"DTEND;TZID="+TZ+":"+d(b.end.dateTime).replace(/:/g,""))}
    L.push("SUMMARY:"+e(x.title));
    if(x.location)L.push("LOCATION:"+e(x.location));
    if(x.description)L.push("DESCRIPTION:"+e(x.description));
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");return L.join("\r\n")+"\r\n";
}
$("ok").onclick=function(){
  var s=sel(),a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([ics(s)],{type:"text/calendar;charset=utf-8"}));
  a.download="events.ics";a.click();
  $("rs").textContent=s.length+"件を events.ics に書き出しました。Googleカレンダーの「設定 → インポート」で読み込んでください。";
};

var dz=$("drop");
["dragenter","dragover"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add("on")})});
["dragleave","drop"].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove("on")})});
dz.addEventListener("drop",function(e){var f=e.dataTransfer.files;if(f.length){$("file").files=f;$("file").onchange({target:$("file")})}});
</script>
</body>
</html>
